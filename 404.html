<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found · Atlantic Media</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --ocean: #0e1b2c; --sand: #f3ede3; --terra: #a65e3f; --muted: rgba(243,237,227,.7); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--ocean); color: var(--sand); font-family: Manrope, system-ui, sans-serif; display: grid; place-items: center; padding: 24px; text-align: center; }
  main { max-width: 560px; }
  img { height: 56px; width: auto; margin-bottom: 36px; }
  .kicker { font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: #e3b79f; margin-bottom: 14px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(36px, 7vw, 64px); line-height: 1.02; letter-spacing: -.02em; }
  h1 em { font-style: italic; color: #e3b79f; }
  p { color: var(--muted); margin-top: 18px; font-size: 1.05rem; line-height: 1.5; }
  .ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
  a.btn { display: inline-block; padding: 13px 22px; border-radius: 999px; font-weight: 700; font-size: .95rem; text-decoration: none; color: var(--sand); }
  a.btn--terra { background: var(--terra); }
  a.btn--line { border: 1px solid rgba(243,237,227,.35); }
  a.btn:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
  <img src="/assets/brand/logo-white.png" alt="Atlantic Media" />
  <p class="kicker">404 · Page not found</p>
  <h1>This link went <em>off-script.</em></h1>
  <p>The page you're after has moved or never existed. Head back home, or tell us what you were looking for.</p>
  <div class="ctas"><a class="btn btn--terra" href="/">Back to the home page →</a><a class="btn btn--line" href="/contact#enquiry">Slide into our DMs →</a></div>
</main>
</body>
</html>
